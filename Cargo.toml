[package]
name = "localcoder"
version = "0.1.9"
edition = "2024"
description = "oxink."
license = "MIT"
readme = "README.md"
repository = "https://github.com/iamwjun/localcoder"

[package.metadata.trueos-blueprint]
profile = "release"

[dependencies]
# HTTP client
reqwest = { version = "=0.13.3", default-features = false, features = ["json", "stream", "rustls-no-provider"] }
# Async runtime
tokio = { version = "=1.52.1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "fs", "process", "signal", "test-util"] }
# JSON handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Error handling
anyhow = "1.0"
# CLI interaction
rustyline = "14.0"
# Terminal colors
colored = "2.1"
# File globbing (S03 GlobTool)
glob = "0.3"
# File walking with .gitignore support (S03 GrepTool)
ignore = "0.4"
# Regex engine (S03 GrepTool)
regex = "1"
serde_yaml = "0.9"
# Match TRUEOS blueprint framework YAML map ordering support.
indexmap = "=2.14.0"
libc = { version = "=0.2.185", default-features = false }

[target.'cfg(not(target_os = "trueos"))'.dependencies]
rustls = { version = "=0.23.37", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
atomic-waker = { path = "../../TRUEOS/vendor/atomic-waker-1.1.2" }
bytes = { path = "../../TRUEOS/vendor/bytes-1.11.1" }
futures-channel = { path = "../../TRUEOS/vendor/futures-channel-0.3.32" }
futures-core = { path = "../../TRUEOS/vendor/futures-core-0.3.32" }
hyper = { path = "../../TRUEOS/vendor/hyper-1.9.0" }
hyper-util = { path = "../../TRUEOS/vendor/hyper-util-0.1.20" }
itoa = { path = "../../TRUEOS/vendor/itoa-1.0.18" }
libc = { path = "../../TRUEOS/vendor/libc-0.2.185" }
mio = { path = "../../TRUEOS/vendor/mio-1.2.0" }
pin-project-lite = { path = "../../TRUEOS/vendor/pin-project-lite-0.2.17" }
smallvec = { path = "../../TRUEOS/vendor/smallvec-1.15.1" }
socket2 = { path = "../../TRUEOS/vendor/socket2-0.6.3" }
reqwest = { path = "../../TRUEOS/vendor/reqwest-0.13.3" }
tokio = { path = "../../TRUEOS/vendor/tokio-1.52.1" }
trueos-sys = { path = "../../TRUEOS/crates/trueos-sys" }
try-lock = { path = "../../TRUEOS/vendor/try-lock-0.2.5" }
want = { path = "../../TRUEOS/vendor/want-0.3.1" }
